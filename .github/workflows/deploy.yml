name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'  # IMPORTANT: Only triggers if files in the 'backend' folder change

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to your repository, then specifically into the backend folder
            cd /home/${{ secrets.EC2_USERNAME }}/Better-UO-Scheduler/backend
            
            # 2. Pull the latest code
            git pull origin main
            
            # 3. Activate the virtual environment
            # (This assumes you created 'venv' inside the backend folder on your EC2 instance)
            source venv/bin/activate
            
            # 4. Install any new dependencies
            pip install -r requirements.txt
            
            # 5. Restart the background process
            sudo systemctl restart scheduler-api
